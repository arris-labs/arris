# Virtual workspace manifest. The crates and their dependency edges are the
# table in docs/ARCHITECTURE.md §Crates; tools/check-layers.sh enforces
# that no crate depends on one above it.
[workspace]
resolver = "3"
members = ["crates/*"]
# The fuzz crate builds on nightly under `cargo fuzz` (ADR-0024 §5).
exclude = ["fuzz"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arris-labs/arris"
# Resolved relative to this manifest, so every member inherits the one
# workspace README as its crates.io front page.
readme = "README.md"

[workspace.dependencies]
# Internal crates, referenced by path from the workspace so every *normal*
# edge is declared in exactly one place. `default-features` is stated
# explicitly (Cargo requires it here to let a member override it) so a
# dependent can opt out of, say, arris-topo's and arris-io's own
# `default = ["serde"]` and forward the feature itself instead (`arris`'s
# own `serde` feature, `cargo check -p arris --no-default-features`).
#
# The `version` beside each path is what makes the crates publishable: it
# is the requirement the registry copy carries. It is pinned with `=` to
# the workspace version, `-dev` and all: the crates are published in
# lockstep and only make sense as a set, and the pin is what fails the
# build if a version bump misses one of them (.agents/rules/git.md §Tags). A *dev*-dependency on a
# sibling is therefore never inherited from here — it is written path-only
# at its use site, and `cargo publish` strips it from the packaged
# manifest. A version there would demand the sibling on crates.io first,
# and the dev edges run in every direction (arris-geom tests against
# arris-topo, arris-ops against arris-io), so no publish order could
# satisfy them.
arris-math = { path = "crates/arris-math", version = "=0.6.0", default-features = false }
arris-geom = { path = "crates/arris-geom", version = "=0.6.0", default-features = false }
arris-topo = { path = "crates/arris-topo", version = "=0.6.0", default-features = false }
arris-check = { path = "crates/arris-check", version = "=0.6.0", default-features = false }
arris-ops = { path = "crates/arris-ops", version = "=0.6.0", default-features = false }
arris-mesh = { path = "crates/arris-mesh", version = "=0.6.0", default-features = false }
arris-io = { path = "crates/arris-io", version = "=0.6.0", default-features = false }
# `arris-debug` is only ever a dev-dependency, so its path-only form lives
# here rather than at eight use sites. It is also the one crate that stays
# unpublished (`publish = false`): dev-facing tooling — dump, rasteriser,
# fixtures, strategies — never part of the kernel a consumer builds
# against (docs/ARCHITECTURE.md §Formats and tools).
arris-debug = { path = "crates/arris-debug" }
# The facade, as `arris-py` (unpublished, layer above it) depends on it: path-only,
# since nothing published may depend on an unpublished crate and this one is not
# published either (docs/ARCHITECTURE.md §Crates, ADR-0034).
arris = { path = "crates/arris" }

# External crates, pinned here and used with `workspace = true` (SEED.md §4).
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
robust = "1.2"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
# float_roundtrip: a fixture's 17-digit coordinates must parse to the same f64
# the oracle read, or the recipe hash and the geometry comparison drift by an ulp.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
# The native format's byte encoding (docs/DATA-MODEL.md §Native format):
# pure Rust, deterministic, builds for wasm32.
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
sha2 = "0.10"
proptest = { version = "1.11", default-features = false, features = ["std"] }
# PNG only: the rasteriser writes one format, and the default codec set
# pulls in dependencies that do not build for wasm32.
image = { version = "0.25", default-features = false, features = ["png"] }
# `arris-debug`'s `rerun` feature only, and never on wasm32 (01 §Threading).
# `sdk` alone (no viewer, no importers, no analytics) is the logging client.
rerun = { version = "0.37.1", default-features = false, features = ["sdk"] }
# The `parallel` features of `arris-mesh` and `arris-ops` only, and never on
# wasm32 (01 §Threading).
rayon = "1.10"
# `arris-py` only, and never on wasm32 (ADR-0034 §2, §7). Pinned to the minor;
# an upgrade is a plan step that re-runs the `forbid(unsafe_code)` check.
# `extension-module` is `arris-py`'s own feature, set by maturin.
pyo3 = { version = "0.26", default-features = false, features = ["macros", "abi3-py310"] }

# Every crate opts in with `[lints] workspace = true`
# (.agents/rules/kernel.md §API).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# The dev profile — every `cargo test`, the pre-commit hook, the `inspect`
# tooling — runs with light optimisation and debug assertions on, so the
# checker still runs after every operation (`.agents/rules/kernel.md`) while
# the property tests over bodies whose (u, v) polygons hold tens of
# thousands of points finish: at `opt-level = 0` a boolean at a random
# pose took a second and its `Full` check up to forty; at 1 both are
# twenty to forty times faster. Debug info stays.
[profile.dev]
opt-level = 1
