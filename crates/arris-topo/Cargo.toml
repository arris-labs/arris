[package]
name = "arris-topo"
description = "Arris kernel: the model arena, typed ids, handles, orientation, entities and provenance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[features]
default = ["serde"]
# Derives on ids, handles and the model: the native format is serde of the
# model (docs/DATA-MODEL.md §Native format).
serde = ["dep:serde", "arris-math/serde", "arris-geom/serde"]

[dependencies]
arris-math.workspace = true
arris-geom.workspace = true
thiserror.workspace = true
serde = { workspace = true, optional = true }

# The seeded property-test runner lives in `arris-debug`; the dev-dependency
# cycle it makes is why the property tests are integration tests under
# `tests/` (docs/ARCHITECTURE.md §Formats and tools).
[dev-dependencies]
# No version on the internal dev-dependencies below: a version would put
# them in the published manifest, and no publish order satisfies the cycle
# they make (the workspace manifest says why).
arris-debug.workspace = true
# `import` and `retain` prove their survivors with the checker, and so does
# every body `assemble` puts back together.
arris-check = { path = "../arris-check" }
# The two primitives are the bodies the corpus's `primitive/*` fixtures
# describe: `assemble` is run over them beside the samples.
arris-ops = { path = "../arris-ops" }
proptest.workspace = true
serde_json.workspace = true
# The consumer key's byte-exact encoding check: the native format's bytes
# are postcard (docs/DATA-MODEL.md §Native format).
postcard = { workspace = true, features = ["alloc"] }

[lints]
workspace = true
