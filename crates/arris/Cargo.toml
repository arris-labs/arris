[package]
name = "arris"
description = "A B-Rep geometric kernel in pure Rust: tolerance-carrying topology, booleans with provenance, blends, tessellation and STEP"
keywords = ["cad", "geometry", "brep", "kernel", "solid-modeling"]
categories = ["graphics", "mathematics", "science"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[features]
default = ["serde"]
serde = ["arris-topo/serde", "arris-io/serde"]
parallel = ["arris-ops/parallel", "arris-mesh/parallel"]
paranoid = ["arris-ops/paranoid"]

[dependencies]
arris-math.workspace = true
arris-geom.workspace = true
arris-topo.workspace = true
arris-check.workspace = true
arris-ops.workspace = true
arris-mesh.workspace = true
arris-io.workspace = true

# Dev-facing only: never reaches a consumer (docs/ARCHITECTURE.md §Formats
# and tools), so it is a dev-dependency of the facade, not a dependency.
[dev-dependencies]
serde_json.workspace = true
arris-debug.workspace = true
proptest.workspace = true

# The corpus benchmark (ADR-0024 §4): an in-house timer, so its own
# `main`, not libtest's bench harness.
[[bench]]
name = "corpus"
harness = false

[lints]
workspace = true
