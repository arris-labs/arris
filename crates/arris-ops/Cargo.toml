[package]
name = "arris-ops"
description = "Arris kernel: primitives, sweeps, transforms, booleans and mass properties"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[features]
# The boolean's face-pair intersections and per-face splitting over
# rayon, both collected in the sequential order so a result is identical
# either way; never enabled on wasm32 (01 §Threading).
parallel = ["dep:rayon"]
# Run the checker after every operation in release builds too, returning
# `OpError::Internal` instead of a debug build's panic.
paranoid = []

[dependencies]
arris-math.workspace = true
arris-geom.workspace = true
arris-topo.workspace = true
arris-check.workspace = true
thiserror.workspace = true
rayon = { workspace = true, optional = true }

# The sample bodies, the dump and the oracle seam live in `arris-debug`,
# the STEP writer in `arris-io`, the tessellator the sweeps' mesh check
# runs in `arris-mesh`; dev-dependencies are exempt from the layer rule.
[dev-dependencies]
# No version on the internal dev-dependencies below: a version would put
# them in the published manifest, and no publish order satisfies the cycle
# they make (the workspace manifest says why).
arris-debug.workspace = true
arris-io = { path = "../arris-io" }
arris-mesh = { path = "../arris-mesh" }
proptest.workspace = true

[lints]
workspace = true
