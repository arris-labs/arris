[package]
name = "arris-check"
description = "Arris kernel: the invariant checker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[features]
# Forwarded, not used directly: a consumer that reaches `arris_topo`'s
# types through this crate's re-export (`arris-io`'s native format) needs
# a path to `arris-topo/serde` that does not depend on its default
# features being on.
serde = ["arris-topo/serde"]

[dependencies]
arris-math.workspace = true
arris-geom.workspace = true
arris-topo.workspace = true

# The sample bodies the violation tests break live in `arris-debug`; a
# dev-dependency is exempt from the layer rule. The seeded property-test
# runner is there too, and `proptest` supplies the assertion macros the
# classifier's properties are written with.
[dev-dependencies]
arris-debug.workspace = true
proptest.workspace = true

[lints]
workspace = true
