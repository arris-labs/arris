[package]
name = "arris-io"
description = "Arris kernel: STEP AP214, the native format, and the mesh formats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[features]
default = ["serde"]
# The native format: serde of the model, `postcard` for bytes and
# `serde_json` for diffs (docs/DATA-MODEL.md §Native format). Forwards to
# `arris-check/serde` (itself a forward to `arris-topo/serde`, its only
# path there) rather than relying on `arris-topo`'s own default features.
serde = ["dep:serde", "dep:serde_json", "dep:postcard", "arris-check/serde"]

[dependencies]
arris-math.workspace = true
arris-geom.workspace = true
arris-topo.workspace = true
arris-check.workspace = true
# Mesh formats: STL and OBJ write an `arris_mesh::TriMesh` (ADR-0013).
arris-mesh.workspace = true
thiserror.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }

# The sample bodies the writer is tried on and the oracle comparison live in
# `arris-debug`; a dev-dependency is exempt from the layer rule. `arris-ops`
# builds the filleted box the mesh formats' tests hold to the oracle too.
[dev-dependencies]
# No version on the internal dev-dependencies below: a version would put
# them in the published manifest, and no publish order satisfies the cycle
# they make (the workspace manifest says why).
arris-debug.workspace = true
arris-ops = { path = "../arris-ops" }
proptest.workspace = true

[lints]
workspace = true
