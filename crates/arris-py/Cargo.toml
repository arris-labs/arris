[package]
name = "arris-py"
description = "Arris kernel: the Python binding (PyPI `arris`), a thin layer over the facade"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "arris_py"
# The cdylib is the extension module; the rlib keeps `cargo test`, clippy
# and the hook's nextest run working (ADR-0034 §7).
crate-type = ["cdylib", "rlib"]

[features]
# Set by maturin (`pyproject.toml`), never by a Rust build: an extension
# module must not link libpython, a test binary must.
extension-module = ["pyo3/extension-module"]

[dependencies]
arris.workspace = true

# pyo3 does not build for wasm32-unknown-unknown, so the crate is empty
# there (ADR-0034 §7).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pyo3.workspace = true

[lints]
workspace = true
