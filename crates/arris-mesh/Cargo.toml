[package]
name = "arris-mesh"
description = "Arris kernel: triangle meshes, polylines and tessellation of bodies"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[features]
# Faces triangulated in parallel after the sequential edge pass, results
# collected in face order so the mesh is identical either way; never
# enabled on wasm32 (01 §Threading).
parallel = ["dep:rayon"]

[dependencies]
arris-math.workspace = true
arris-geom.workspace = true
arris-topo.workspace = true
arris-check.workspace = true
thiserror.workspace = true
rayon = { workspace = true, optional = true }

# The seeded property-test runner and the sample bodies live in
# `arris-debug`; a dev-dependency is exempt from the layer rule.
[dev-dependencies]
# No version on the internal dev-dependencies below: a version would put
# them in the published manifest, and no publish order satisfies the cycle
# they make (the workspace manifest says why).
arris-debug.workspace = true
# The primitives are what the random-pose tessellation tests mesh.
arris-ops = { path = "../arris-ops" }
proptest.workspace = true

[lints]
workspace = true
