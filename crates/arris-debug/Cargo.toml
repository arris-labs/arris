[package]
name = "arris-debug"
description = "Arris kernel: dev-facing text dump, PNG rasteriser, fixture loader and property-test strategies"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[features]
# Stream a body to a Rerun viewer for the human (`arris_debug::rerun`).
# Native-only, never on wasm32 — see the target-gated dependency below.
rerun = ["dep:rerun"]

[dependencies]
arris-math.workspace = true
arris-geom.workspace = true
arris-topo.workspace = true
arris-ops.workspace = true
arris-mesh.workspace = true
arris-io = { workspace = true, features = ["serde"] }
image.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

# Property tests never run on wasm, and proptest's random source does not
# build for wasm32-unknown-unknown; the `prop` module follows this cfg.
# The `rerun` feature is native-only for the same reason (01 §Threading);
# `dep:rerun` above only pulls it in when the feature is also on.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
proptest.workspace = true
rerun = { workspace = true, optional = true }

[lints]
workspace = true
