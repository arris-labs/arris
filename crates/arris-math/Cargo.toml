[package]
name = "arris-math"
description = "Arris kernel: points, vectors, frames, intervals, exact predicates, root finding and Precision"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[features]
# `Precision` is part of the native format; `arris-topo/serde` turns this on.
serde = ["dep:serde", "nalgebra/serde-serialize"]

[dependencies]
libm.workspace = true
nalgebra.workspace = true
robust.workspace = true
serde = { workspace = true, optional = true }

# `arris-debug` supplies the seeded property-test runner and strategies; the
# dev-dependency cycle it makes is why the property tests are integration
# tests under `tests/` (docs/ARCHITECTURE.md §Formats and tools).
[dev-dependencies]
arris-debug.workspace = true
proptest.workspace = true
serde_json.workspace = true

[lints]
workspace = true
