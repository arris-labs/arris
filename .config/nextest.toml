# nextest profiles (ADR-0032). The default profile is what CI runs and is
# unchanged. `fast` is the pre-commit hook's: every test but the named slow
# set and the committed real-part excerpts, which `/retire-plan`, CI and
# nightly run. `full` is the default's behaviour, named so a skill can say
# "the full profile". Case counts are not a profile feature; `tools/gate.sh`
# prints them and the hook exports them.

[profile.default]
# Nextest runs one test per process on every CPU unless told otherwise, and
# ignores RUST_TEST_THREADS. Measured on the `fast` profile at 32 cases,
# 2513 tests (32 CPUs, 61 GiB, peak memory <= 2.2 GiB at every count):
# 4 threads 1285 s, 8 675 s, 16 402 s, 32 372 s. Sixteen leaves half the
# machine to the other terminal for 8% more time than all of it.
test-threads = 16

[profile.fast]
#
# The slow set: a single test that is not a shard of a property and costs
# ~30 s or more at the hook's case counts, as `tools/test-timings.sh
# --slow-set` prints it (ADR-0032's rule, ADR-0066's measurement).
# `tools/profile-test.sh` holds the set to exactly these names.
default-filter = """
not (
  test(/^real_/)
  or test(=a_budget_stops_every_operation_at_the_same_step_and_leaves_the_model_as_it_was)
  or test(=an_oracle_with_no_solid_holds_arris_to_additivity)
  or test(=arris_and_the_oracle_agree_on_multi_tool_booleans)
  or test(=blend_drilled_torus_fillet)
  or test(=blend_fixtures_read_back)
  or test(=blend_nist_ctc_04_chamfered_wall_fillet)
  or test(=blend_nist_ftc_10_cylinder_pair_bspline_fillet)
  or test(=boolean_ball_pole_drill_cut)
  or test(=boolean_ball_pole_slice_cut)
  or test(=boolean_fixtures_read_back)
  or test(=boolean_nist_ctc_04_face_arrangement_turn)
  or test(=boolean_nist_ctc_05_ap203_box_cut_nurbs_plane)
  or test(=boolean_nist_ctc_05_ap242_box_cut_nurbs_plane)
  or test(=boolean_pipe_elbow_fuse)
  or test(=boolean_pipe_elbow_fuse_band_ends)
  or test(=boolean_plate_10x10_holes_cut_many)
  or test(=boolean_revolve_extrude_fuse_cut_rounding_knots)
  or test(=boolean_ring_corner_common)
  or test(=boolean_ring_pin_cut)
  or test(=census::tests::ftc_06_run_is_a_dihedral_jump_of_the_nurbs_cycle)
  or test(=census::tests::no_split_rims_second_vertex_is_refused)
  or test(=guard::coverage)
  or test(=loft_loft_closed_torus_like)
  or test(=part::tests::a_battery_stage_is_held_to_its_class)
  or test(=provenance_consumer_rebuild)
  or test(=split_nurbs_cylinder_oblique)
  or test(=sweep_fixtures_read_back)
  or test(=sweep_sweep_spring_cut_split)
  or test(=the_band_at_the_fixtures_numbers)
  or test(=transform_mirror_hollow_ring)
)
"""

[profile.full]

# `arris-debug`'s oracle_cache tests share the process-wide cache setting and
# the oracle's scratch files, and take turns on a `Mutex` that nextest's
# process per test does not share; at sixteen threads they raced on the
# same STEP file ("the file ends before END-ISO-10303-21"). One at a time.
[test-groups]
oracle-cache = { max-threads = 1 }

[[profile.default.overrides]]
filter = "binary(oracle_cache)"
test-group = "oracle-cache"
