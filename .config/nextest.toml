[profile.full]

# `arris-debug`'s oracle_cache tests share the process-wide cache setting and
# the oracle's scratch files, and take turns on a `Mutex` that nextest's
# process per test does not share; at sixteen threads they raced on the
# same STEP file ("the file ends before END-ISO-10303-21"). One at a time.
[test-groups]
oracle-cache = { max-threads = 1 }

[[profile.default.overrides]]
filter = "binary(oracle_cache)"
test-group = "oracle-cache"

# `nightly` is the property jobs' profile (ADR-0086). A test is stopped at
# 2 h (30m x 4), not the default's 4 h: the property shards stop themselves
# at their time budget (`ARRIS_PROPTEST_BUDGET`), so a cap is only the
# backstop for one chunk that overruns. The elbow and standoff caps of 5.5 h
# that stood here are gone with the nightly's 5000-case count. The global
# cap, 315 min under the job's 350, makes nextest write JUnit before the job
# is cut; a cancelled job writes none.
[profile.nightly]
test-threads = "num-cpus"
slow-timeout = { period = "30m", terminate-after = 4 }
global-timeout = "315m"

# The differential is not a property shard: its two long tests run past 2 h
# and were stopped at the cap (TIMEOUT 7200 s) in run 42724063416, which the
# triage read as new `timeout -` signatures. Before the nightly profile the
# differential ran under the default's 4 h cap and finished (run 42659620551,
# 229 min for the job), so the cap is restored here: 30m x 8 = 4 h.
[[profile.nightly.overrides]]
filter = "binary(differential)"
slow-timeout = { period = "30m", terminate-after = 8 }

[profile.nightly.junit]
path = "junit.xml"
store-success-output = true
