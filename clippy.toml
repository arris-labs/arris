# Transcendental functions go through `arris_math::real` (ADR-0064): the std
# methods are the platform's libm, and a last-place difference between
# targets is a different body. Not listed, because IEEE 754 makes them
# exact or correctly rounded everywhere: sqrt, mul_add, abs, floor, ceil,
# round, trunc, rem_euclid, min, max, to_radians.
