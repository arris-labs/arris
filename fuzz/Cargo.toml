# The fuzz targets over the intersectors (ADR-0024 §5), the STEP
# reader (ADR-0025) and body bytes (ADR-0029). Outside the
# workspace: it builds on the nightly toolchain under `cargo fuzz`, its
# dependencies are none of the workspace's, and it is never published.
# `docs/ARCHITECTURE.md` §Formats and tools; `fuzz/README.md` for use.
[package]
name = "arris-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = "1.4"
libfuzzer-sys = "0.4"
arris-math = { path = "../crates/arris-math" }
arris-geom = { path = "../crates/arris-geom" }
# The Part 21 parser, and the native format's serde for body bytes.
arris-io = { path = "../crates/arris-io", default-features = false, features = ["serde"] }

# The seed writer reads the geometry fixtures through the loader the
# oracle test uses, and builds the solid fixtures to write their STEP;
# an example, so the fuzz targets never link it.
[dev-dependencies]
arris-debug = { path = "../crates/arris-debug" }

[[example]]
name = "seed"
path = "seed.rs"

[[example]]
name = "show"
path = "show.rs"

[[example]]
name = "latency"
path = "latency.rs"

[[bin]]
name = "intersect_surfaces"
path = "fuzz_targets/intersect_surfaces.rs"
test = false
doc = false
bench = false

[[bin]]
name = "intersect_curve_surface"
path = "fuzz_targets/intersect_curve_surface.rs"
test = false
doc = false
bench = false

[[bin]]
name = "intersect_curves"
path = "fuzz_targets/intersect_curves.rs"
test = false
doc = false
bench = false

[[bin]]
name = "step_read"
path = "fuzz_targets/step_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "body_read"
path = "fuzz_targets/body_read.rs"
test = false
doc = false
bench = false

# Its own workspace, so the root's never claims it.
[workspace]
