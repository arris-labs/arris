name: CI

# On a `v*` tag too: the release waits on the `crates-io` environment's
# reviewer (`release.yml`), and this is the run they look at before
# approving it — the gate on the exact commit being published.
#
# A push that changes only prose is skipped: the hook already ran the whole
# suite on it, and the `test` job costs hours at CI's case count. The docs a
# test reads stay in (`doc_drift` reads DATA-MODEL, `docs_refs` the plans,
# the histogram test the roadmap). GitHub evaluates no path filter on a tag.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "**"
      - "!docs/**"
      - "!.agents/**"
      - "!AGENTS.md"
      - "!SEED.md"
      - "!CHANGELOG.md"
      - "!crates/*/CHANGELOG.md"
      - "docs/ROADMAP.md"
      - "docs/DATA-MODEL.md"
      - "docs/plans/**"
  pull_request:

# A newer push to main supersedes a running check of an older one: main's
# tip holds every commit before it. A tag's run is the release gate and is
# never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The roadmap's acceptance count for property tests is 1000 cases each
  # (docs/ROADMAP.md §M1); the pre-commit hook keeps the 256 default.
  # The STEP tests run the oracle's compare.py on Arris's output, so the
  # oracle environment is synced first (tools/oracle/README.md).
  #
  # The suite runs under nextest, which overlaps the test binaries and puts
  # every test in its own process; a property split into shards
  # (`arris_debug::prop_shards!`) is what makes that worth doing. nextest
  # does not run doctests, so those are their own step — together the two
  # are the whole suite, and a plain `cargo test --workspace` beside them
  # would only pay for the same work twice.
  #
  # The corpus's ignored tests run too (docs/ROADMAP.md §M5), all but the
  # `regression_*` ones: a failure shrunk to a fixture waits under
  # `tests/fixtures/regression/`, ignored, until its fix, and must not turn
  # CI red meanwhile (.agents/rules/kernel.md §Testing). Every other corpus
  # area holds no ignored fixture — the corpus lint fails one without its
  # blessed dump — so that run finds nothing to skip there.
  test:
    runs-on: ubuntu-latest
    env:
      ARRIS_PROPTEST_CASES: "1000"
      # The differential at CI's count too (ADR-0024 §2); the hook runs
      # its default of 32.
      ARRIS_DIFF_CASES: "1000"
      # CI never trusts an oracle cache (ADR-0024 §1).
      ARRIS_ORACLE_CACHE: "off"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --project tools/oracle
      - run: cargo nextest run --workspace
      - run: cargo nextest run -p arris --test corpus --run-ignored only --no-tests pass -E 'not test(/^regression_/)'
      - run: cargo test --workspace --doc

  # The `parallel` features prove determinism, not coverage: the same tests
  # give byte-identical results with the work split across threads. So they
  # run at the default case count, in a job of their own beside `test`. At
  # `test`'s 1000 cases, run after it, they repeated its property coverage
  # on an oversubscribed runner, about an hour per step.
  parallel:
    runs-on: ubuntu-latest
    env:
      ARRIS_ORACLE_CACHE: "off"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # The corpus through the facade compares against the oracle.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --project tools/oracle
      # arris-mesh's `parallel` feature: the same tests, so every sample
      # body's and primitive's mesh is byte-identical with faces
      # triangulated in parallel.
      - run: cargo nextest run -p arris-mesh --features parallel
      # arris-ops's, and the corpus through the facade with both on: every
      # boolean fixture's dump and every property test's result
      # byte-identical with the face pairs intersected and the faces split
      # in parallel.
      - run: cargo nextest run -p arris-ops --features parallel
      - run: cargo nextest run -p arris --features parallel

  # A consumer that wants no serde support gets none of its cost: every
  # internal workspace dependency disables default features
  # (docs/ARCHITECTURE.md §Formats and tools), so arris-topo's and
  # arris-io's own `default = ["serde"]` reach the build only through
  # `arris`'s own `serde` feature, on by default but off here.
  no-default-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p arris --no-default-features
      - run: |
          if cargo tree -p arris --no-default-features -e normal | grep -q serde_json; then
            echo "serde_json reaches arris --no-default-features" >&2
            exit 1
          fi

  # A library's docs are part of its API: a broken intra-doc link or a
  # missing doc on a public item fails the build.
  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  # The layer rule of docs/ARCHITECTURE.md §Crates: no crate depends on
  # one above it. The self-test proves the script still detects a violation.
  layers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: tools/check-layers.sh
      - run: tools/check-layers.sh --self-test

  # A break since the last release is announced (ADR-0027): the published
  # crates against the last `v*` tag, and a breaking change fails unless
  # CHANGELOG.md's `## Unreleased` names it under `### Breaking`. The whole
  # history is fetched so the tag and its tree are there to build.
  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gate reads its verdict out of coloured output — this job runs
      # with CARGO_TERM_COLOR=always — so its self-test pins that read
      # before the tool it reads is even installed.
      - run: tools/semver-gate.sh --self-test
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-semver-checks
      - run: tools/semver-gate.sh

  # The Open CASCADE oracle agrees with itself: every op against closed
  # forms, committed expected.json values reproduced, OCCT's own STEP read
  # back clean (tools/oracle/README.md).
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --project tools/oracle
      - run: uv run --project tools/oracle tools/oracle/selftest.py

  # Pure Rust, wasm-capable (SEED.md §4): the kernel builds for wasm with
  # its default features. A crate that grows a native-only dependency
  # breaks here first.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --target wasm32-unknown-unknown

  # The Python binding (ADR-0034): a `maturin develop` build, the pytest
  # over it (the oracle's numbers for corpus fixtures, every docstring
  # example, `mypy.stubtest` against the stubs), at the oldest and the
  # newest Python the abi3 wheel supports. Never in the pre-commit hook; the
  # hook's Rust checks still compile the crate. The last step is the build
  # half of the release's `pypi` job: a release-profile wheel and the sdist,
  # which `twine check` accepts, uploaded as an artifact; nothing publishes.
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.1.0
      - name: a virtual environment with the build tools
        shell: bash
        run: |
          uv venv --python ${{ matrix.python }} "$RUNNER_TEMP/venv"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" maturin twine
      - run: maturin develop --uv --manifest-path crates/arris-py/Cargo.toml --extras test
      - run: pytest crates/arris-py
      - if: matrix.python == '3.13'
        run: |
          maturin build --release --manifest-path crates/arris-py/Cargo.toml --out dist
          maturin sdist --manifest-path crates/arris-py/Cargo.toml --out dist
          twine check --strict dist/*
      - if: matrix.python == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*

  # arris-debug's `rerun` feature pulls in the large `rerun` SDK crate:
  # kept out of the hook and the `test` job so that feature's build time
  # never slows either, but still blocking here since a broken feature is
  # a broken crate.
  rerun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p arris-debug --features rerun
