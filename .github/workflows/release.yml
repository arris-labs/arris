# The release (.agents/rules/git.md §Tags): a `v*` tag push publishes the
# eight library crates to crates.io, the Python package `arris` to PyPI in
# lockstep (ADR-0034), and opens a GitHub Release. The gate is CI, which
# runs on this tag too (`ci.yml`) — each publish waits on its own
# environment's reviewer (`crates-io`, `pypi`), who has that run in front of
# them. The two publishes are independent: one failing never stops the other.
# `cargo publish` then builds every packaged crate before uploading any, so
# a crate that does not compile from its tarball uploads nothing.
#
# Publishing uses crates.io trusted publishing: no token in the repository's
# secrets, crates.io trusts this workflow file, in this repository, in the
# named environment.
#
# One-time setup, by the human:
#   GitHub  › Settings › Environments: `crates-io`, with a required
#     reviewer — a crates.io version can be yanked, never replaced.
#   First release only: a crates.io API token (scopes publish-new and
#     publish-update) as the secret CARGO_REGISTRY_TOKEN in `crates-io`;
#     crates.io only lets a publisher be added to a crate that exists.
#   After it: crates.io › each of arris, arris-math, arris-geom,
#     arris-topo, arris-check, arris-ops, arris-mesh, arris-io › Settings ›
#     Trusted Publishing › add: owner arris-labs, repository arris, workflow
#     release.yml, environment crates-io. Then delete the secret; the job
#     falls back to it only while it exists.
#
# PyPI is trusted publishing too, with no token anywhere. One-time setup, by
# the human:
#   GitHub  › Settings › Environments: `pypi`, with a required reviewer — a
#     PyPI file can be yanked, never replaced.
#   pypi.org › Your projects › Publishing › add a pending publisher for the
#     name `arris`: owner arris-labs, repository arris, workflow
#     release.yml, environment pypi. (Reserves the name at the first
#     upload; the plan leaves that upload to the human.)
name: Release

on:
  push:
    tags: ["v*"]
  # A dry run on a branch: `gh workflow run release.yml --ref <branch>`
  # builds and checks every Python file, then the version guard refuses
  # the branch, so nothing publishes and `crates-io` never starts.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  crates-io:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
      contents: write
    env:
      # Mapped here because a step's `if:` cannot read a secret.
      REGISTRY_TOKEN_SECRET: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      # A crates.io version cannot be replaced, so the tag must name the
      # version the crates carry, and a pre-release version never goes up
      # under a release tag.
      - shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "arris"))')
          echo "workspace version $version, tag $GITHUB_REF_NAME"
          case "$version" in
            *-*) echo "::error::refusing to publish the pre-release $version"; exit 1 ;;
          esac
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not name version $version"; exit 1
          fi

      # The release notes are the version's section of CHANGELOG.md
      # (ADR-0027), taken before anything uploads: a tag whose version has
      # no section, or an empty one, publishes nothing.
      - shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { inside = (index($0, "## " v " — ") == 1); next }
            inside
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $version, or an empty one"; exit 1
          fi

      - if: env.REGISTRY_TOKEN_SECRET == ''
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      # Resolves the publish order itself and waits for each crate to reach
      # the index before the crate above it goes up — which is what the
      # `version` on every internal edge is for. `arris-debug` is
      # `publish = false` and stays off crates.io.
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || env.REGISTRY_TOKEN_SECRET }}

      - uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ runner.temp }}/notes.md

  # PyPI never lets a file be replaced, so the tag must name the version the
  # package carries and a pre-release (`0.5.0-dev` is `0.5.0.dev0` to
  # Python) never goes up under a release tag. A job of its own beside the
  # matrix, so a run that is refused here has still built and checked
  # every file.
  pypi-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "arris-py"))')
          echo "package version $version, tag $GITHUB_REF_NAME"
          case "$version" in
            *-*) echo "::error::refusing to publish the pre-release $version"; exit 1 ;;
          esac
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not name version $version"; exit 1
          fi

  # The wheels and the sdist are built outside the `pypi` environment, so
  # the reviewer approves files that already exist, each installed and
  # tested on its own platform, which `twine check` has accepted: Linux
  # x86_64 and aarch64, macOS arm64 and x86_64, Windows x86_64, and the
  # sdist, merged into `python-dist` (`wheels.yml`).
  pypi-build:
    uses: ./.github/workflows/wheels.yml

  pypi:
    needs: [pypi-guard, pypi-build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
