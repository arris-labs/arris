# The platforms beyond Linux x86_64 (ADR-0034, ADR-0064, plans/python-wheels):
# the determinism corpus run natively on each, and one abi3 wheel per
# target, each installed from its file into a clean virtual environment on
# its own platform — never `maturin develop` — and held to the binding's
# pytest. The `dist` job merges the wheels with the sdist into
# `python-dist`. One definition, two callers: `ci.yml` on every push to
# `main`, and `release.yml`, whose `pypi` job publishes `python-dist`. A pull request that touches the Rust or the binding runs
# it on its own trigger below; `gh workflow run wheels.yml --ref <branch>`
# runs it alone on a branch, without the rest of CI.
#
# Targets (runner → target):
#   ubuntu-latest    → x86_64 manylinux2014
#   ubuntu-24.04-arm → aarch64 manylinux2014
#   macos-14         → aarch64-apple-darwin
#   macos-14         → x86_64-apple-darwin, cross-built and tested under
#                      Rosetta with an x86_64 Python (the `determinism-
#                      platforms` job below records that Rosetta runs
#                      there; an Intel image is the fallback if it stops)
#   windows-latest   → x86_64-pc-windows-msvc
# musllinux, Windows arm64 and 32-bit targets are one `include` line each
# later, if someone asks (docs/BACKLOG.md).
name: Wheels

permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/wheels.yml"

env:
  CARGO_TERM_COLOR: always
  # The oldest macOS the wheel claims, in its platform tag.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  # The determinism corpus natively off Linux x86_64 (ADR-0064): every
  # platform a wheel ships for builds the same bodies, held to the same
  # committed digests. A digest that differs is a kernel fault, never a
  # per-platform digest. Windows checks out with Linux's line endings, so
  # the STEP text the corpus embeds is the same bytes. The macOS leg also
  # records whether Rosetta runs x86_64 code there, which is where the
  # `wheel` job tests its x86_64 macOS wheel.
  determinism-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'macOS'
        name: whether Rosetta runs x86_64 code
        run: |
          if arch -x86_64 /usr/bin/true; then
            echo "Rosetta: available on ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Rosetta: not available on ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: cargo test -p arris --test determinism

  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
            python: "3.13"
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2014"
            python: "3.13"
          - runner: macos-14
            target: aarch64-apple-darwin
            python: "3.13"
          - runner: macos-14
            target: x86_64-apple-darwin
            # An x86_64 interpreter, which macOS runs under Rosetta, so
            # the x86_64 extension module is the one that loads.
            python: cpython-3.13-macos-x86_64-none
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            python: "3.13"
    runs-on: ${{ matrix.runner }}
    steps:
      # The tests compare committed text (STEP, OBJ, JSON) byte for byte:
      # Windows checks it out with Linux's line endings.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          command: build
          args: --release --out dist --manifest-path crates/arris-py/Cargo.toml
      - uses: astral-sh/setup-uv@v10.1.0
      # The wheel from its file, with the test extras, into a venv that
      # has seen no build: what `pip install arris` gives a user.
      - name: a clean virtual environment with the built wheel
        shell: bash
        run: |
          venv="$RUNNER_TEMP/venv"
          uv venv --python "${{ matrix.python }}" "$venv"
          if [ "$RUNNER_OS" = Windows ]; then bin="$venv/Scripts"; else bin="$venv/bin"; fi
          echo "VIRTUAL_ENV=$venv" >> "$GITHUB_ENV"
          echo "$bin" >> "$GITHUB_PATH"
          wheel=$(ls dist/*.whl)
          uv pip install --python "$venv" "${wheel}[test]"
      # The suite must import the installed module, not the source tree.
      - name: the installed extension module is the one that loads
        shell: bash
        run: |
          python -c 'import os, sys, sysconfig, arris._arris as m; site = os.path.normcase(sysconfig.get_paths()["platlib"]); print(sys.version, m.__file__); assert os.path.normcase(m.__file__).startswith(site), (m.__file__, site)'
          python -c 'import platform; print(platform.machine())'
      - run: pytest crates/arris-py
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

  # What PyPI receives: every target's wheel and the one sdist, merged into
  # `python-dist` and accepted by `twine check`. It waits on the determinism
  # jobs too, so a platform that builds different bodies has no artifact
  # `release.yml` could publish.
  dist:
    needs: [determinism-platforms, wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path crates/arris-py/Cargo.toml
      - uses: actions/download-artifact@v7
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uvx twine check --strict dist/*
      - name: five wheels and one sdist
        shell: bash
        run: |
          ls -l dist
          # 5 = the wheel matrix's include lines; change both together
          [ "$(ls dist/*.whl | wc -l)" -eq 5 ] && [ "$(ls dist/*.tar.gz | wc -l)" -eq 1 ]
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*
