name: Nightly

# The nightly tier of ADR-0024 §3: the property tests above CI's count on a
# seed that changes every night, the differential at CI's recipe count on
# the same seed, and the corpus's ignored tests. Its depth comes from the
# seeds adding up across nights, not from one night's count.
#
# A red run is the only thing a failure does (ADR-0024 §6): nothing here
# opens an issue or posts anywhere. Reproduce a night locally with the
# `ARRIS_PROPTEST_SEED=…` the `seed` job prints and the job's case count.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "64 hex digits to replay a night; empty draws today's"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  # The nightly never trusts an oracle cache (ADR-0024 §1).
  ARRIS_ORACLE_CACHE: "off"

jobs:
  # One seed for every job of the run, so a job that starts after midnight
  # still tests the night's draw: `sha256` of the UTC date.
  seed:
    runs-on: ubuntu-latest
    outputs:
      seed: ${{ steps.seed.outputs.seed }}
    steps:
      - id: seed
        env:
          GIVEN: ${{ inputs.seed }}
        run: |
          seed="${GIVEN:-$(date -u +%F | tr -d '\n' | sha256sum | cut -d' ' -f1)}"
          echo "ARRIS_PROPTEST_SEED=$seed"
          echo "ARRIS_PROPTEST_SEED=\`$seed\`" >>"$GITHUB_STEP_SUMMARY"
          echo "seed=$seed" >>"$GITHUB_OUTPUT"

  # The property tier at 5000 cases, five times CI's (ADR-0024 §3). At
  # 5000 the suite is 99,600 CPU-seconds on the reference machine, and a
  # 4-core runner takes about 0.385 s per such CPU-second (CI's `test`
  # job: 2 h 21 min for the 22,300 of 1000 cases), so one job would take
  # about ten and a half hours. The matrix splits it by nextest filterset
  # into six jobs of at most about 2 h 20 min each, which leaves more than
  # twice the margin under the runner's six hours for a slower host.
  # `boolean_prop` is 72% of the suite, so its three costliest properties
  # get a job each (plans/measuring-harness step 6's timings).
  properties:
    name: properties (${{ matrix.name }})
    needs: seed
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          # 19,000 CPU-seconds at 5000 cases.
          - name: boolean-quartic
            filter: "binary(boolean_prop) and test(/^quartic_cylinders/)"
          # 16,200.
          - name: boolean-quadric
            filter: "binary(boolean_prop) and test(/^quadric_operands/)"
          # 15,300.
          - name: boolean-crossing
            filter: "binary(boolean_prop) and test(/^crossing_cylinders/)"
          # 21,200.
          - name: boolean-rest
            filter: "binary(boolean_prop) and not test(/^(quartic_cylinders|quadric_operands|crossing_cylinders)/)"
          # 13,200.
          - name: ops-rest
            filter: "package(arris-ops) and not binary(boolean_prop)"
          # 14,600.
          - name: workspace-rest
            filter: "not package(arris-ops)"
    env:
      ARRIS_PROPTEST_SEED: ${{ needs.seed.outputs.seed }}
      ARRIS_PROPTEST_CASES: "5000"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --project tools/oracle
      - run: echo "ARRIS_PROPTEST_SEED=$ARRIS_PROPTEST_SEED ARRIS_PROPTEST_CASES=$ARRIS_PROPTEST_CASES"
      - run: cargo nextest run --workspace --no-fail-fast -E "$FILTER"
        env:
          FILTER: ${{ matrix.filter }}

  # The differential at CI's recipe count, on the night's seed rather than
  # the fixed one (ADR-0024 §2), and the corpus's ignored tests but the
  # waiting regressions, as in `ci.yml`.
  differential:
    needs: seed
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ARRIS_PROPTEST_SEED: ${{ needs.seed.outputs.seed }}
      ARRIS_DIFF_CASES: "1000"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --project tools/oracle
      - run: echo "ARRIS_PROPTEST_SEED=$ARRIS_PROPTEST_SEED ARRIS_DIFF_CASES=$ARRIS_DIFF_CASES"
      - run: cargo nextest run -p arris --test differential --no-capture
      - run: cargo nextest run -p arris --test corpus --run-ignored only --no-tests pass -E 'not test(/^regression_/)'

  # The corpus benchmark (ADR-0024 §4) against the last night that saved a
  # report, through `tools/bench-compare.sh`, the same script run locally.
  # The comparison goes to the job summary with every case past 3×
  # flagged; time never fails the job, only a bench that cannot run does.
  # The baseline is the newest `bench-report` artifact of an earlier run on
  # `main`, whatever the rest of that run did: a red property job says
  # nothing about the timings, and skipping its report would compare
  # against an older night than the last one measured. The first night,
  # or one after the artifacts expired, has no baseline and says so.
  # The fetched tier of the real-part corpus (ADR-0026 §2): NIST's other
  # STEP editions and D2MI models, read, held to Open CASCADE and put
  # through the battery. The archives are cached by the manifest's hash;
  # the oracle's answers are not (ARRIS_ORACLE_CACHE above).
  real-parts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --project tools/oracle
      - uses: actions/cache@v6
        with:
          path: target/real-parts/archives
          key: real-parts-${{ hashFiles('tools/real-parts.sha256') }}
      - run: tools/real-parts.sh --jobs 4
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-parts
          path: |
            target/real-parts/histogram.md
            target/real-parts/failures.md
          if-no-files-found: ignore
          retention-days: 90

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch the last night's report
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          id=$(gh api "repos/$REPO/actions/artifacts?name=bench-report&per_page=50" \
            --jq "[.artifacts[] | select(.expired | not)
                   | select(.workflow_run.id != $RUN_ID)
                   | select(.workflow_run.head_branch == \"main\")][0].workflow_run.id // empty" || true)
          if [ -n "$id" ]; then
            echo "baseline: run $id"
            gh run download "$id" --repo "$REPO" -n bench-report -D target/bench/previous || true
          else
            echo "baseline: none"
          fi
      - run: tools/bench-compare.sh target/bench/previous/latest.json
      - uses: actions/upload-artifact@v7
        with:
          name: bench-report
          path: |
            target/bench/latest.json
            target/bench/comparison.md
          if-no-files-found: error
          retention-days: 90

  # The fuzz targets over the intersectors (ADR-0024 §5), the STEP
  # reader (ADR-0025) and body bytes (ADR-0029), on the nightly
  # toolchain outside the workspace: each target for thirty minutes on
  # the runner's four cores, from the corpus the earlier nights grew —
  # kept in the Actions cache, minimised before it is saved — and the
  # seeds from every geometry fixture's pairs, every solid fixture's STEP
  # file and body bytes' guard. A crash (a panic, a hit off an operand, a
  # body read the checker rejects, two answers to one input) fails the
  # job, and its input is uploaded for `fuzz/show.rs` and `cargo fuzz
  # tmin`. Its depth comes from the nights adding up, as the property
  # tier's does.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [intersect_surfaces, intersect_curve_surface, intersect_curves, step_read, body_read]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      # In release: the STEP seeds build every solid fixture.
      - run: cargo run --release --manifest-path fuzz/Cargo.toml --example seed
      - run: cargo fuzz build -s none ${{ matrix.target }}
        working-directory: fuzz
      - run: cargo fuzz run -s none ${{ matrix.target }} -- -max_total_time=1800 -fork=4
        working-directory: fuzz
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
      # The corpus is saved whatever the night found: a crash's input is
      # in the artifacts, and the coverage reached before it is the next
      # night's start.
      - if: always()
        run: cargo fuzz cmin -s none ${{ matrix.target }}
        working-directory: fuzz
      - if: always()
        uses: actions/cache/save@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
